[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "akashic-engine"
version = "0.0.1"
description = "Provider-agnostic longitudinal intelligence engine for AI agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AKASHIC ENGINE contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
